name: Build Violet Unlocked Module Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Natively fetch the official Xiaomi Kernel Source code
    - name: Download Violet Kernel Source Tree
      uses: actions/checkout@v4
      with:
        repository: 'MiCode/Xiaomi_Kernel_OpenSource'
        ref: 'violet-q-oss'
        path: 'kernel-source'

    # 2. Natively fetch the pre-extracted Android Clang compiler binaries
    - name: Download Pre-Extracted Clang Toolchain
      uses: actions/checkout@v4
      with:
        repository: 'ZyCromerZ/Clang'
        ref: '14'
        path: 'toolchain'

    # 3. Natively fetch the AnyKernel3 framework
    - name: Download AnyKernel3 Packaging Tools Natively
      uses: actions/checkout@v4
      with:
        repository: 'osm0sis/AnyKernel3'
        ref: 'master'
        path: 'anykernel'

    # 4. Set up standard Linux dependencies including the missing cross-compiler components
    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential libncurses5-dev bison flex libssl-dev libelf-dev clang lld git curl zip wget gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    # 5. Patch legacy Python scripts and compile the kernel
    - name: Compile Kernel
      run: |
        # Fix the outdated Python 2 print syntax to make it compatible with modern Python 3 environments
        sed -i 's/print >> sys.stderr, args\[0\] + \x27:\x27,e.strerror/print(args[0] + ": " + e.strerror, file=sys.stderr)/g' kernel-source/scripts/gcc-wrapper.py
        
        cd kernel-source
        export ARCH=arm64
        export SUBARCH=arm64
        export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        
        # Initialize the official stock Xiaomi Violet Android 10 user configuration layout
        make vendor/violet-perf_defconfig
        
        # STRIP AND DISABLE KERNEL MODULE SIGNING LOCKS
        sed -i 's/CONFIG_MODULE_SIG=y/# CONFIG_MODULE_SIG is not set/g' .config
        sed -i 's/CONFIG_MODULE_SIG_FORCE=y/# CONFIG_MODULE_SIG_FORCE is not set/g' .config
        sed -i 's/CONFIG_MODULE_SIG_ALL=y/# CONFIG_MODULE_SIG_ALL is not set/g' .config
        echo "CONFIG_MODULE_FORCE_LOAD=y" >> .config
        
        # Compile using cloud processing cores
        make -j$(nproc)
        
    # 6. Inject the finished files cleanly into AnyKernel3 structure
    - name: Package into Flashable ZIP
      run: |
        if [ -f kernel-source/arch/arm64/boot/Image.gz-dtb ]; then
          cp kernel-source/arch/arm64/boot/Image.gz-dtb anykernel/
        elif [ -f kernel-source/arch/arm64/boot/Image.gz ]; then
          cp kernel-source/arch/arm64/boot/Image.gz anykernel/
          [ -f kernel-source/arch/arm64/boot/dtb ] && cp kernel-source/arch/arm64/boot/dtb anykernel/
          [ -f kernel-source/arch/arm64/boot/dtbo.img ] && cp kernel-source/arch/arm64/boot/dtbo.img anykernel/
        fi
        
        cd anykernel
        sed -i 's/device.name1=test/device.name1=violet/g' anykernel.sh
        zip -r9 ../Violet-UnlockedKernel-A10.zip *

    # 7. Provide the downloadable link block inside the build actions log panel
    - name: Upload Flashable Kernel to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: Violet-Kernel-Flashable-ZIP
        path: Violet-UnlockedKernel-A10.zip
