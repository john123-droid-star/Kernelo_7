- name: Compile Kernel
  run: |
    cat << 'EOF' > kernel-source/scripts/gcc-wrapper.py
    #!/usr/bin/env python3
    import sys, subprocess
    sys.exit(subprocess.call(sys.argv[1:]))
    EOF
    chmod +x kernel-source/scripts/gcc-wrapper.py
    
    # FIX TRACE EVENT LOOKUP ROADBLOCK: Create trace header in correct driver directory
    mkdir -p kernel-source/drivers/clk/qcom/mdss
    cat << 'EOF' > kernel-source/drivers/clk/qcom/mdss/mdss_pll_trace.h
    #undef TRACE_SYSTEM
    #define TRACE_SYSTEM mdss_pll
    #if !defined(_TRACE_MDSS_PLL_H) || defined(TRACE_HEADER_MULTI_READ)
    #define _TRACE_MDSS_PLL_H
    #include <linux/tracepoint.h>
    #endif
    #include <trace/define_trace.h>
    EOF
    
    sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' kernel-source/scripts/dtc/dtc-lexer.lex.c_shipped
    
    cd kernel-source
    export ARCH=arm64
    export SUBARCH=arm64
    export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
    export CROSS_COMPILE=aarch64-linux-gnu-
    export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
    export CC=clang
    
    make vendor/violet-perf_defconfig
    
    sed -i '/CONFIG_DSI_CLK_PLL/d' .config
    echo "# CONFIG_DSI_CLK_PLL is not set" >> .config
    
    sed -i 's/CONFIG_MODULE_SIG=y/# CONFIG_MODULE_SIG is not set/g' .config
    sed -i 's/CONFIG_MODULE_SIG_FORCE=y/# CONFIG_MODULE_SIG_FORCE is not set/g' .config
    sed -i 's/CONFIG_MODULE_SIG_ALL=y/# CONFIG_MODULE_SIG_ALL is not set/g' .config
    echo "CONFIG_MODULE_FORCE_LOAD=y" >> .config
    
    make -j$(nproc) KCFLAGS="-Wno-error -Wno-designated-init -Wno-missing-include-dirs"
